<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Gas El Volcán - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- ENCABEZADO COMPARTIDO (Con soporte de menú responsive) -->
    <header>
        <nav>
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                    <img src="img/logo.jpg" alt="Logo Gas El Volcán" style="height: 70px; width: auto; object-fit: contain; border-radius: 4px;">
                    <span class="logo-nombre" style="font-size: 1.3rem; font-weight: bold; color: var(--color-primario);">Gas El Volcán</span>
                </a>
            </div>

            <!-- Botón hamburguesa para celulares (según CSS del equipo) -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
            <label for="menu-toggle" class="menu-toggle-btn">&#9776;</label>

            <ul class="menu-principal">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>

            <div class="acciones-usuario">
                <a href="login.html">Iniciar sesión</a>
                <a href="registro.html">Registrar usuario</a>
                <a href="carrito.html" class="carrito-link">🛒 Cart (<span id="contadorCarrito">0</span>)</a>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL: LOGIN -->
    <main class="contenedor-auth">
      <div class="auth-card">
      
        <!-- Logo y Nombre destacados (Figura 5 del mockup) -->
        <div class="auth-header">
          <div class="logo-placeholder" style="font-size: 3rem;">🔥</div>
          <h2>Gas El Volcán</h2>
          <p class="subtitulo">Ingresa a tu cuenta para gestionar tus pedidos</p>
        </div>

        <!-- Formulario de Login -->
        <form id="formLogin" novalidate>
        
          <!-- Campo: Correo Electrónico -->
          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input 
              type="email" 
              id="correo" 
              name="correo" 
              maxlength="100" 
              placeholder="ejemplo@duoc.cl o @gmail.com"
              required
            >
            <small class="mensaje-error" id="error-correo"></small>
          </div>

          <!-- Campo: Contraseña -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              minlength="4" 
              maxlength="10" 
              placeholder="Entre 4 y 10 caracteres"
              required
            >
            <small class="mensaje-error" id="error-password"></small>
          </div>

          <!-- Botón de envío -->
          <button type="submit" class="btn-primario btn-block">Iniciar sesión</button>

          <!-- Mensaje general de éxito/error al enviar -->
          <div id="mensaje-general" class="mensaje-alerta"></div>
        </form>

        <!-- Enlace para registrarse -->
        <div class="auth-footer">
          <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>

      </div>
    </main>

    <!-- PIE DE PÁGINA COMPARTIDO -->
    <footer>
      <p>&copy; 2026 Distribuidora Gas El Volcán</p>
    </footer>

    <!-- Scripts -->
    <script src="js/carrito.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
