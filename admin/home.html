<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Gas El Volcán</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <span>Gas El Volcán</span>
            </div>
            <ul class="admin-menu">
                <li><a href="home.html" class="activo">Dashboard</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="usuarios.html">Usuarios</a></li>
                <li><a href="../index.html">Ver sitio normal</a></li>
                <li><a href="../index.html" onclick="localStorage.removeItem('usuarioActivo')">Cerrar Sesión</a></li>

        <main class="admin-contenido">

            <div class="dashboard-stats">

    <script src="../js/productos-data.js"></script>
