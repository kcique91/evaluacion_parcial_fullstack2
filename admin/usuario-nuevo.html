<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Gas El Volcán</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div class="admin-logo">
                <span>Gas El Volcán</span>
            </div>
            <ul class="admin-menu">
                <li><a href="home.html">Dashboard</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="usuarios.html">Usuarios</a></li>
            </ul>
        </aside>

        <main class="admin-contenido">
            <h1>Nuevo Usuario</h1>

            <form id="formUsuarioNuevo" novalidate>

                <div class="form-group">
                    <label for="run">RUN</label>
                    <input type="text" id="run" name="run" placeholder="19011022K" maxlength="9" autocomplete="off">
                    <span class="error-mensaje" id="errorRun"></span>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="50" autocomplete="given-name">
                    <span class="error-mensaje" id="errorNombre"></span>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" maxlength="100" autocomplete="family-name">
                    <span class="error-mensaje" id="errorApellidos"></span>
                </div>

                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" maxlength="100" placeholder="ej: cliente@gmail.com" autocomplete="email">
                    <span class="error-mensaje" id="errorCorreo"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" minlength="4" maxlength="10" autocomplete="new-password">
                    <span class="error-mensaje" id="errorPassword"></span>
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" autocomplete="bday">
                    <span class="error-mensaje" id="errorFechaNacimiento"></span>
                </div>

                <div class="form-group">
                    <label for="tipoUsuario">Tipo de Usuario</label>
                    <select id="tipoUsuario" name="tipoUsuario">
                        <option value="">Seleccione</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Cliente">Cliente</option>
                        <option value="Vendedor">Vendedor</option>
                    </select>
                    <span class="error-mensaje" id="errorTipoUsuario"></span>
                </div>

                <div class="form-group">
                    <label for="region">Región</label>
                    <select id="region" name="region">
                        <option value="">Seleccione Región</option>
                        <option value="Región de Ñuble">Región de Ñuble</option>
                    </select>
                    <span class="error-mensaje" id="errorRegion"></span>
                </div>

                <div class="form-group">
                    <label for="comuna">Comuna</label>
                    <select id="comuna" name="comuna">
                        <option value="">Seleccione Comuna</option>
                    </select>
                    <span class="error-mensaje" id="errorComuna"></span>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" maxlength="300" autocomplete="street-address">
                    <span class="error-mensaje" id="errorDireccion"></span>
                </div>

                <button type="submit" class="btn-primario">Guardar Usuario</button>

            </form>

        </main>

    </div>

    <script>
        const comunasPorRegion = {
            "Región de Ñuble": ["Chillán", "Chillán Viejo", "El Carmen", "Pinto", "San Ignacio", "Bulnes", "Quillón"]
        };

        document.getElementById("region").addEventListener("change", function () {
            const region = this.value;
            const selectComuna = document.getElementById("comuna");
            selectComuna.innerHTML = '<option value="">Seleccione Comuna</option>';
            if (comunasPorRegion[region]) {
                comunasPorRegion[region].forEach(c => {
                    let opt = document.createElement("option");
                    opt.value = c;
                    opt.textContent = c;
                    selectComuna.appendChild(opt);
                });
            }
        });
    </script>
    <script src="../js/validaciones-comunes.js"></script>
    <script src="../js/usuario-nuevo.js"></script>
</body>
</html>
